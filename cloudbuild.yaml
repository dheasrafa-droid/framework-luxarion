steps:
  # 1. Build Docker image with tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/luxarion-engine:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/luxarion-engine:latest', '.']

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/luxarion-engine:latest']

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'luxarion-engine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/luxarion-engine:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/luxarion-engine:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/luxarion-engine:latest'
